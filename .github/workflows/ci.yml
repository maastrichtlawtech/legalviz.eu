name: CI
# Pull requests only: pages.yml runs the same lint/test/build on every push to
# main before deploying, so a push-triggered run here would duplicate it.
on:
  pull_request:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm run lint
      - run: npm test
      - run: npm run build
