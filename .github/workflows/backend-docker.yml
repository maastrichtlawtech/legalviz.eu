name: Backend Docker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-docker.yml"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: legalviz-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start backend
        run: docker run --detach --name legalviz-backend --publish 3000:3000 legalviz-backend:ci
      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs legalviz-backend
          exit 1
      - name: Smoke-test SQLite-backed interfaces
        run: |
          curl --fail --silent "http://127.0.0.1:3000/api/search?q=gdpr&limit=1" \
            | jq --exit-status '.results[0].celex == "32016R0679"'
          curl --fail --silent "http://127.0.0.1:3000/api/topics?celex=32016R0679" \
            | jq --exit-status '.topics["32016R0679"] | length > 0'
          curl --fail --silent "http://127.0.0.1:3000/api/resolve-reference?actType=regulation&year=2016&number=679" \
            | jq --exit-status '.resolved.celex == "32016R0679"'
          docker exec legalviz-backend node -e '
            const fs = require("node:fs");
            if (!fs.existsSync("search/data/data.sqlite")) throw new Error("SQLite artifact missing");
            if (!fs.existsSync("search/data/data.sqlite.manifest.json")) throw new Error("manifest missing");
            if (fs.readdirSync("search/data").some((name) => name.endsWith(".json.gz"))) {
              throw new Error("source JSON assets leaked into final image");
            }
          '
      # date and eurovoc are enriched inline onto the records as the cache builders
      # last step. Publishing a raw search-cache instead of carrying the enriched
      # asset forward silently strips both: every pre-2010 act serves a null date,
      # and /api/topics goes empty. The topics endpoint above only catches the
      # second, so assert the invariant the release notes state -- every record
      # dated, every record carrying an eurovoc key (an empty array is legitimate).
      - name: Assert record enrichment survived the data build
        run: |
          docker exec legalviz-backend node -e '
            const Database = require("better-sqlite3");
            const db = new Database("search/data/data.sqlite", { readonly: true });
            // The JSON path is bound, not inlined: SQLite reads a double-quoted
            // literal as an identifier, and this runs inside single quotes already.
            const missing = (jsonPath) => db.prepare(
              "SELECT COUNT(*) AS c FROM laws WHERE json_extract(record_json, ?) IS NULL"
            ).get(jsonPath).c;
            const laws = db.prepare("SELECT COUNT(*) AS c FROM laws").get().c;
            const undated = missing("$.date");
            const untopiced = missing("$.eurovoc");
            // inForce is a tri-state, and json_extract cannot police it: it
            // returns SQL NULL both for an absent key and for a stored JSON
            // null ("Cellar has no status"), which is a legitimate value.
            // json_type returns SQL NULL only when the key is genuinely absent.
            const untyped = (jsonPath) => db.prepare(
              "SELECT COUNT(*) AS c FROM laws WHERE json_type(record_json, ?) IS NULL"
            ).get(jsonPath).c;
            const unstatused = untyped("$.inForce");
            // A run that answered "unknown" for every act would still carry the
            // key everywhere, so also assert real booleans actually landed.
            // ~87% is the ceiling, not 100%: Cellar carries no in-force triple
            // at all for ~10k Commission Implementing Regulations (mostly
            // 2000s), so `null` there is correct rather than a failed fetch.
            // The floor only needs to catch a wholesale enrichment collapse.
            // Both the path and the two type names are bound. Nothing in this
            // script may contain a literal single quote: the whole thing is
            // already inside single quotes in the YAML, so bash strips them and
            // IN ('true', 'false') arrives as IN (true, false) - SQLite keywords
            // for 1 and 0, which never match a text json_type and silently
            // return zero. Bind values; do not quote them.
            const decided = db.prepare(
              "SELECT COUNT(*) AS c FROM laws WHERE json_type(record_json, ?) IN (?, ?)"
            ).get("$.inForce", "true", "false").c;
            db.close();
            if (undated > 0) throw new Error(undated + "/" + laws + " laws have no date - search-cache lost its date enrichment");
            if (untopiced > 0) throw new Error(untopiced + "/" + laws + " laws have no eurovoc key - search-cache lost its EuroVoc enrichment");
            if (unstatused > 0) throw new Error(unstatused + "/" + laws + " laws have no inForce key - search-cache lost its in-force enrichment");
            if (decided < laws * 0.8) throw new Error(decided + "/" + laws + " laws have a known in-force status - expected >80% (data-v8 shipped 87%), in-force enrichment is degraded");
            console.log("enrichment intact: " + laws + " laws, all dated, all carrying eurovoc, " + decided + " with a known in-force status");
          '
      - name: Gate production search quality and signal coverage
        run: |
          docker run --rm legalviz-backend:ci node --expose-gc search/eval/run.js \
            --sqlite search/data/data.sqlite \
            --cases search/eval/ranking-queries.json \
            --split holdout \
            --limit 10 \
            --iterations 1 \
            --enable-rewrites \
            --json > search-evaluation.json
          jq --exit-status '
            .quality.recallAt1 >= 0.55 and
            .quality.recallAt5 >= 0.75 and
            .quality.ndcgAt10 >= 0.72 and
            .quality.candidateRecall.union >= 0.90 and
            (.signals.eurovocRecords / .signals.records) >= 0.80 and
            (.signals.knownStatusRecords / .signals.records) >= 0.80 and
            (.signals.excerptRecords / .signals.records) >= 0.95 and
            (.signals.citedRecords / .signals.records) >= 0.35
          ' search-evaluation.json
          jq '{quality: {recallAt1: .quality.recallAt1, recallAt5: .quality.recallAt5, ndcgAt10: .quality.ndcgAt10, candidateRecall: .quality.candidateRecall.union}, signals}' search-evaluation.json
      - name: Container logs
        if: always()
        run: docker logs legalviz-backend || true
      - name: Stop backend
        if: always()
        run: docker rm --force legalviz-backend || true
